<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VapourDense - QR Code</title>
  <meta name="description" content="QR Code and print card for VapourDense portfolio website.">
  <link rel="preconnect" href="https://fonts.cdnfonts.com">
  <link href="https://fonts.cdnfonts.com/css/phenomena" rel="stylesheet">
  <style>
    /* VDVC Brand Fonts */
    @font-face {
      font-family: 'Moon 2.0 Light All Caps';
      src: local('Moon 2.0 Light All Caps'), local('Moon 2.0 Light'), local('Moon 2.0'), local('Moon-Light'), local('Moon');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Waxe Regular';
      src: local('Waxe Regular'), local('Waxe-Regular'), local('Waxe');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Uni Sans Thin';
      src: local('Uni Sans Thin'), local('UniSans-Thin'), local('Uni Sans Thin All Caps'), local('Uni Sans');
      font-weight: 100;
      font-style: normal;
    }

    @font-face {
      font-family: 'Uni Sans Light';
      src: local('Uni Sans Light'), local('UniSans-Light'), local('Uni Sans');
      font-weight: 300;
      font-style: normal;
    }

    @font-face {
      font-family: 'Uni Sans Regular';
      src: local('Uni Sans Regular'), local('UniSans-Regular'), local('Uni Sans');
      font-weight: 400;
      font-style: normal;
    }

    @font-face {
      font-family: 'Uni Sans Heavy';
      src: local('Uni Sans Heavy'), local('UniSans-Heavy'), local('Uni Sans Heavy All Caps'), local('Uni Sans');
      font-weight: 800;
      font-style: normal;
    }

    :root {
      --bg-dark: #080c14;
      --card-bg: #0f172a;
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Uni Sans Regular', 'Uni Sans Light', system-ui, sans-serif;
      background: radial-gradient(circle at 50% 15%, #1e293b 0%, #0f172a 40%, #030712 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.25rem;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(129, 140, 248, 0.08) 50%, transparent 70%);
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    /* Card styling */
    .qr-card {
      width: 100%;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      box-shadow: 
        0 25px 60px -15px rgba(0, 0, 0, 0.75),
        0 0 40px -10px var(--accent-glow),
        inset 0 1px 1px rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .qr-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
    }

    /* Header */
    .card-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      width: 72px;
      height: 72px;
    }

    .logo-badge img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(56, 189, 248, 0.35));
    }

    /* Brand Typography: Moon 2.0 Light + Waxe Regular */
    .brand-title {
      font-size: 1.85rem;
      line-height: 1.2;
      color: #ffffff;
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.25rem;
    }

    .font-vapour {
      font-family: 'Moon 2.0 Light All Caps', 'Moon 2.0', 'Moon', sans-serif;
      text-transform: uppercase;
      font-weight: 300;
      letter-spacing: 0.08em;
    }

    .font-dense {
      font-family: 'Waxe Regular', 'Waxe', sans-serif;
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .font-virtual-cafe {
      font-family: 'Phenomena', sans-serif;
      font-weight: 300;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.95rem;
      color: var(--accent);
    }

    .font-unisans-thin-caps {
      font-family: 'Uni Sans Thin', 'Uni Sans', sans-serif;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.18em;
    }

    .font-unisans-heavy {
      font-family: 'Uni Sans Heavy', 'Uni Sans', sans-serif;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* QR Code Box */
    .qr-frame {
      background: #ffffff;
      padding: 1.25rem;
      border-radius: 22px;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 270px;
      height: 270px;
      margin: 0 auto;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .qr-frame:hover {
      transform: scale(1.02);
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.5),
        0 0 30px var(--accent-glow);
    }

    .qr-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Scan notice & link */
    .scan-notice {
      margin-top: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
    }

    .scan-instruction {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.05rem;
      font-family: 'Phenomena', sans-serif;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #f1f5f9;
    }

    .scan-instruction svg {
      width: 18px;
      height: 18px;
      stroke: var(--accent);
    }

    .url-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.6rem 1rem;
      border-radius: 12px;
      font-family: 'Uni Sans Regular', 'Uni Sans', monospace;
      font-size: 0.825rem;
      color: #e2e8f0;
      text-decoration: none;
      transition: all 0.2s ease;
      max-width: 100%;
      word-break: break-all;
    }

    .url-chip:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: var(--accent);
      color: #38bdf8;
    }

    .tag-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .tag {
      font-family: 'Uni Sans Thin', 'Uni Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.3rem 0.75rem;
      border-radius: 9999px;
    }

    /* Action Toolbar (Screen only) */
    .action-toolbar {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.8rem 1rem;
      border-radius: 14px;
      font-family: 'Uni Sans Heavy', 'Uni Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.825rem;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      outline: none;
    }

    .btn-primary {
      grid-column: span 2;
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.45);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.12);
      color: #f1f5f9;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      background: #10b981;
      color: #ffffff;
      padding: 0.65rem 1.25rem;
      border-radius: 9999px;
      font-family: 'Uni Sans Regular', 'Uni Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Print Specific Media Styles */
    @media print {
      @page {
        size: A4 portrait;
        margin: 2cm 1.5cm;
      }

      *, *:before, *:after {
        background: transparent !important;
        color: #000000 !important;
        box-shadow: none !important;
        text-shadow: none !important;
      }

      html, body {
        background: #ffffff !important;
        color: #0f172a !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        display: block !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .ambient-glow,
      .action-toolbar,
      .toast,
      .no-print {
        display: none !important;
      }

      .container {
        max-width: 100% !important;
        width: 100% !important;
        margin: 0 auto !important;
      }

      .qr-card {
        background: #ffffff !important;
        border: 2px solid #0f172a !important;
        color: #0f172a !important;
        padding: 2.5rem 2rem !important;
        border-radius: 20px !important;
        page-break-inside: avoid !important;
      }

      .qr-card::before {
        background: #0f172a !important;
        height: 4px !important;
      }

      .brand-title .font-vapour,
      .brand-title .font-dense {
        color: #0f172a !important;
      }

      .font-virtual-cafe {
        color: #0284c7 !important;
      }

      .logo-badge {
        background: #f8fafc !important;
        border: 1px solid #94a3b8 !important;
      }

      .logo-badge img {
        filter: none !important;
      }

      .qr-frame {
        background: #ffffff !important;
        border: 2px solid #0f172a !important;
        width: 250px !important;
        height: 250px !important;
        margin: 0 auto !important;
      }

      .scan-instruction {
        color: #0f172a !important;
      }

      .scan-instruction svg {
        stroke: #0f172a !important;
      }

      .url-chip {
        background: #f1f5f9 !important;
        border: 1px solid #cbd5e1 !important;
        color: #0f172a !important;
      }

      .tag {
        background: #f8fafc !important;
        border: 1px solid #cbd5e1 !important;
        color: #334155 !important;
      }
    }
  </style>
</head>

          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>Open Site</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status">Link copied to clipboard!</div>

  <script>
    function copyWebsiteUrl() {
      const url = 'https://vapourdense-website.vercel.app/';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          showToast();
        }).catch(() => fallbackCopy(url));
      } else {
        fallbackCopy(url);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast();
      } catch (e) {
        console.error('Copy failed', e);
      }
      document.body.removeChild(ta);
    }

    function showToast() {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }
  </script>
</body>
